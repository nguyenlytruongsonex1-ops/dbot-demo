[project]
name = "dbot-demo"
version = "0.2.0"
description = "A lightweight CrewAI-based database administrator demo with realtime alerts and DBA chat"
requires-python = ">=3.11"
dependencies = [
  "crewai>=0.86.0,<2.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "psutil>=6.0.0,<7.0.0",
  "PyYAML>=6.0.0,<7.0.0",
  "httpx>=0.27.0,<1.0.0",
  "openai>=1.60.0,<2.0.0",
  "pytest>=8.0.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0"
]

[project.scripts]
dbot = "app.cli:main"
dbot-scenario = "scenarios.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scenarios"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
