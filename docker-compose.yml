x-app-env: &app-env
  PG_HOST: postgres
  PG_DB: dbot_demo
  PG_ADMIN_USER: dbot
  PG_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:-dbot}
  SQLITE_PATH: /data/dbot.sqlite
  SCENARIO_DIR: /scenarios
  KNOWLEDGE_DIR: /app/knowledge

services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    environment:
      POSTGRES_USER: dbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbot}
      POSTGRES_DB: dbot_demo
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbot -d dbot_demo"]
      interval: 5s
      retries: 30

  tpch-seed:
    build: ./seed
    environment:
      PGHOST: postgres
      PGUSER: dbot
      PGPASSWORD: ${POSTGRES_PASSWORD:-dbot}
      PGDATABASE: dbot_demo
      TPCH_SF: ${TPCH_SF:-0.1}
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"

  monitor:
    build: .
    command: ["python", "-m", "app.monitor"]
    environment: *app-env
    volumes: ["appdata:/data"]
    depends_on: {tpch-seed: {condition: service_completed_successfully}}
    restart: unless-stopped

  backend:
    build: .
    command: ["uvicorn", "app.backend:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app-env
    ports: ["${APP_PORT:-8000}:8000"]
    volumes: ["appdata:/data", "./scenarios:/scenarios"]
    depends_on: {tpch-seed: {condition: service_completed_successfully}}
    restart: unless-stopped

  dbot-worker:
    build:
      context: .
      args: {WITH_CREWAI: "1"}
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *app-env
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["appdata:/data"]
    depends_on: {tpch-seed: {condition: service_completed_successfully}}
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
