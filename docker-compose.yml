services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbot}
      POSTGRES_DB: ${POSTGRES_DB:-dbot_demo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dbot} -d $${POSTGRES_DB:-dbot_demo}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  dbot:
    build: .
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-dbot_demo}
      DB_USER: ${POSTGRES_USER:-dbot}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dbot}
      LLM_MODE: ${LLM_MODE:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME:-gpt-4o-mini}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      DBOT_MAX_ITERATIONS: ${DBOT_MAX_ITERATIONS:-8}
      DBOT_LOG_LEVEL: ${DBOT_LOG_LEVEL:-INFO}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
