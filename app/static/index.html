<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>D-Bot Demo - Bảng theo dõi DBA</title>
<link rel="stylesheet" href="/static/style.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head><body x-data="app()" x-init="init()">
<header><b>D-Bot Demo</b> · Bảng theo dõi sự cố PostgreSQL
  <span class="muted" style="color:#cde" x-text="connected ? ' · real time: đã kết nối' : ' · real time: mất kết nối'"></span></header>
<main>
<section>
  <h3>Alert</h3>
  <table><thead><tr><th>#</th><th>Sự cố</th><th>Mức độ</th><th>Trạng thái</th><th>AI</th><th>Thời gian</th><th></th></tr></thead>
  <tbody>
  <template x-for="a in alerts" :key="a.id"><tr>
    <td x-text="a.id"></td>
    <td><a :href="'/alert/' + a.id" x-text="a.title"></a></td>
    <td><span class="badge" :class="a.severity" x-text="a.severity"></span></td>
    <td><span class="badge" :class="a.status" x-text="a.status === 'open' ? 'đang mở' : 'đã giải quyết'"></span></td>
    <td><span class="badge" :class="a.analysis_status" x-text="aiLabel(a.analysis_status)"></span></td>
    <td class="muted" x-text="fmt(a.created_at)"></td>
    <td><button class="primary" @click="analyze(a.id)" :disabled="a.analysis_status==='analyzing'">Nhờ AI phân tích</button></td>
  </tr></template>
  <tr x-show="alerts.length===0"><td colspan="7" class="muted">Chưa có alert. Hãy chạy một kịch bản bên phải.</td></tr>
  </tbody></table>
</section>
<section>
  <h3>Kịch bản sự cố</h3>
  <template x-for="s in scenarios" :key="s.name"><div class="scn">
    <b x-text="s.name"></b> <span class="badge" :class="s.status==='running'?'analyzing':'none'" x-text="s.status"></span>
    <button @click="run(s.name)" :disabled="s.status==='running'">Chạy</button>
    <button @click="stop(s.name)" :disabled="s.status!=='running'">Dừng</button>
    <div class="muted" x-show="s.message" x-text="s.message"></div>
    <details><summary class="muted">Mô tả</summary><pre x-text="s.description"></pre></details>
  </div></template>
  <h4>Thêm kịch bản</h4>
  <form @submit.prevent="upload($event)">
    <input name="name" placeholder="ten_kich_ban" required pattern="[a-z0-9_]{2,40}"><br><br>
    <input name="file" type="file" accept=".sql" required><br><br>
    <button class="primary">Tải lên</button> <span class="muted" x-text="uploadMsg"></span>
  </form>
</section>
</main>
<script>
function app(){return{alerts:[],scenarios:[],connected:false,uploadMsg:'',
 async load(){this.alerts=await (await fetch('/api/alerts')).json();this.scenarios=await (await fetch('/api/scenarios')).json()},
 init(){this.load();this.ws()},
 ws(){const w=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  w.onopen=()=>this.connected=true;w.onmessage=()=>this.load();
  w.onclose=()=>{this.connected=false;setTimeout(()=>this.ws(),2000)}},
 async analyze(id){await fetch(`/api/alerts/${id}/analyze`,{method:'POST'});this.load()},
 async run(n){const r=await fetch(`/api/scenarios/${n}/run`,{method:'POST'});if(!r.ok)alert((await r.json()).detail);this.load()},
 async stop(n){await fetch(`/api/scenarios/${n}/stop`,{method:'POST'});this.load()},
 async upload(e){const r=await fetch('/api/scenarios/upload',{method:'POST',body:new FormData(e.target)});
  const j=await r.json();this.uploadMsg=r.ok?'Đã lưu kịch bản '+j.name:j.detail;if(r.ok)e.target.reset();this.load()},
 aiLabel(s){return {none:'chưa phân tích',analyzing:'đang phân tích',done:'đã có báo cáo',error:'lỗi'}[s]},
 fmt(t){return new Date(t*1000).toLocaleTimeString('vi-VN')}}}
</script></body></html>
