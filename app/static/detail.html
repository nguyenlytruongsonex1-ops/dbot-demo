<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Chi tiết alert</title>
<link rel="stylesheet" href="/static/style.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head><body x-data="detail()" x-init="init()">
<header><a href="/">← Quay lại bảng theo dõi</a></header>
<section class="detail" x-show="a">
  <h2 x-text="a && ('#' + a.id + ' ' + a.title)"></h2>
  <p><span class="badge" :class="a?.severity" x-text="a?.severity"></span>
     <span class="badge" :class="a?.status" x-text="a?.status==='open'?'đang mở':'đã giải quyết'"></span>
     <span class="badge" :class="a?.analysis_status" x-text="a?.analysis_status"></span>
     <button class="primary" @click="analyze()" :disabled="a?.analysis_status==='analyzing'">Nhờ AI phân tích</button></p>
  <details><summary>Số liệu từ monitor</summary><pre class="code" x-text="JSON.stringify(a?.details,null,2)"></pre></details>
  <p x-show="a?.analysis_status==='analyzing'">D-Bot đang phân tích, có thể mất 1 đến 3 phút...</p>
  <template x-if="a && a.report">
   <div>
    <h3>Tóm tắt</h3><p x-text="a.report.summary"></p>
    <h3>Nguyên nhân gốc</h3><p x-text="a.report.root_cause"></p>
    <h3>Các bước suy luận</h3>
    <template x-for="(s,i) in a.report.steps"><details>
      <summary x-text="(i+1)+'. '+(s.tool||'bước')+(s.conclusion?' → '+s.conclusion:'')"></summary>
      <div class="muted">Quan sát:</div><pre class="code" x-text="s.observation"></pre>
    </details></template>
    <h3>Phương án xử lý (AI chỉ đề xuất, DBA tự quyết định chạy)</h3>
    <template x-for="r in a.report.remediation"><div>
      <p><b x-text="r.action"></b> <span class="muted" x-text="r.risk ? '(rủi ro: '+r.risk+')' : ''"></span></p>
      <pre class="code" x-show="r.sql" x-text="r.sql"></pre></div></template>
    <p class="muted" x-text="'Nguồn: '+a.report.provider+' · thời gian phân tích: '+a.report.elapsed_sec+' giây'"></p>
   </div></template>
</section>
<script>
function detail(){return{a:null,id:location.pathname.split('/').pop(),
 async load(){this.a=await (await fetch('/api/alerts/'+this.id)).json()},
 init(){this.load();const w=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');w.onmessage=()=>this.load()},
 async analyze(){await fetch(`/api/alerts/${this.id}/analyze`,{method:'POST'});this.load()}}}
</script></body></html>
